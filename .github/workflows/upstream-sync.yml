name: upstream-sync
# Keeps Komainu in step with OpenCode, with no manual steps:
#   1. every 6 hours, look for a new OpenCode release
#   2. re-apply Komainu's patches to it, build, and run the tests
#   3. passed     → bump fork/UPSTREAM on main and publish a Komainu release with prebuilt binaries;
#                   everyone's komainu then shows "update available" and /update installs it
#      conflicts  → open an issue so the patches can be refreshed (fork/README.md explains how)
# Pushing a change under fork/ also publishes a release if the current version has none yet.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fork/**", ".github/workflows/upstream-sync.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      - name: Find latest upstream release
        id: latest
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/anomalyco/opencode 'v*' \
            | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          current=$(cat fork/UPSTREAM)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "OpenCode latest: $latest, Komainu pinned: $current"

      - name: Apply patches to the new release and build
        id: build
        if: steps.latest.outputs.latest != steps.latest.outputs.current
        continue-on-error: true
        run: fork/build.sh "${{ steps.latest.outputs.latest }}"

      - name: Run Komainu's tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat ripgrep
          npm i -g @anthropic-ai/sandbox-runtime
          bun install --frozen-lockfile
          bun run typecheck && bun test && bun run bench/injection/run.ts --ci

      - name: Adopt the new release on main
        if: steps.build.outcome == 'success' && steps.tests.outcome == 'success'
        env:
          TAG: ${{ steps.latest.outputs.latest }}
        run: |
          git config user.name "carlmasters02"
          git config user.email "169651373+carlmasters02@users.noreply.github.com"
          echo "$TAG" > fork/UPSTREAM
          rm -f fork/REVISION
          git add -A fork/UPSTREAM fork/REVISION
          git commit -m "chore(fork): sync with OpenCode $TAG"
          git push origin HEAD:main

      - name: Open issue (patches need updating)
        if: steps.latest.outputs.latest != steps.latest.outputs.current && (steps.build.outcome != 'success' || steps.tests.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.latest }}
        run: |
          title="Komainu could not sync with OpenCode $TAG"
          [ "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq length)" = "0" ] || exit 0
          gh issue create --title "$title" \
            --body "OpenCode $TAG is out, but Komainu's patches did not apply, the build failed, or the tests failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}, then refresh fork/patches (fork/README.md explains how)."

      - name: Work out the release version
        id: version
        run: |
          upstream=$(cat fork/UPSTREAM)
          version="${upstream#v}-komainu"
          [ -s fork/REVISION ] && version="$version.$(cat fork/REVISION)"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "v$version is already released"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binaries
        if: steps.version.outputs.publish == 'true'
        env:
          KOMAINU_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            OPENCODE_TARGET=$target fork/build.sh "${{ steps.version.outputs.upstream }}"
            # Compressed archives are what komainu-update downloads (xz ~3x smaller, gzip as a fallback).
            # The plain binary stays for update scripts from before the archives existed.
            cp fork/dist/komainu "release/komainu-$target"
            rm -rf pkg && mkdir pkg && cp fork/dist/komainu pkg/komainu
            XZ_OPT="-6 -T0" tar -C pkg -cJf "release/komainu-$target.tar.xz" komainu
            tar -C pkg -czf "release/komainu-$target.tar.gz" komainu
          done
          ./release/komainu-linux-x64 --version | grep -q "$KOMAINU_VERSION"
          (cd release && sha256sum komainu-* > SHA256SUMS && cat SHA256SUMS)

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
        run: |
          gh release create "v$VERSION" release/* --target "$(git rev-parse HEAD)" --latest \
            --title "Komainu $VERSION" \
            --notes "Komainu built on OpenCode $UPSTREAM: OpenCode's changes and security fixes, plus Komainu's protections.
          OpenCode's release notes: https://github.com/anomalyco/opencode/releases/tag/$UPSTREAM

          Inside komainu, run /update (or accept the update notice). From a terminal: komainu-update."
