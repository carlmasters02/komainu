name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: npm i -g @anthropic-ai/sandbox-runtime
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run bench/injection/run.ts --ci
      # Beginners without Node.js get srt run on Bun (fork/install.sh); make sure the real sandbox tests pass that way too.
      - name: sandbox tests with srt on Bun
        run: |
          mkdir -p "$RUNNER_TEMP/srt-bun"
          printf '#!/bin/sh\nexec "%s" --bun "%s" "$@"\n' "$(command -v bun)" "$(readlink -f "$(command -v srt)")" > "$RUNNER_TEMP/srt-bun/srt"
          chmod 755 "$RUNNER_TEMP/srt-bun/srt"
          PATH="$RUNNER_TEMP/srt-bun:$PATH" bun test sandbox
